<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polygraph Studio — เครื่องจับเท็จไร้สาย</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='22' y='4' width='56' height='92' rx='14' fill='%23173f73'/><path d='M32 50h10l5-14 9 28 5-14h8' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-logo" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M8 12h2l1-3 2 6 1-3h2"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4M8.5 10h7M8.5 14h7M8.5 18h4"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16M8 7h7"/></symbol>
<symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
<symbol id="i-batt" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M5 10v4"/></symbol>
<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><path d="M12 19.5h.01"/></symbol>
<symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4M9 12h7M9 16h7"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12h.01"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></symbol>
<symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M7.5 15h9"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
<symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h4l2-5 4 10 2-5h8"/></symbol>
</svg>
<div class="app">
  <!-- ======================= แถบเมนูซ้าย ======================= -->
  <aside class="sidebar">
    <div class="brand"><div class="logo"><svg class=i><use href=#i-logo></use></svg></div><div><b>Polygraph Studio</b><span>Wireless Lie Detector</span></div></div>
    <nav class="nav" id="nav">
      <button data-view="session" class="active"><span class="ico"><svg class=i><use href=#i-clip></use></svg></span>ทดสอบ</button>
      <button data-view="results"><span class="ico"><svg class=i><use href=#i-chart></use></svg></span>ผลลัพธ์ &amp; รายงาน</button>
      <button data-view="system"><span class="ico"><svg class=i><use href=#i-gear></use></svg></span>ระบบ &amp; อุปกรณ์</button>
      <button data-view="guide"><span class="ico"><svg class=i><use href=#i-book></use></svg></span>คู่มือ &amp; หลักการ</button>
      <button id="link-watchpage" title="หน้าเว็บที่ฝังอยู่ในนาฬิกา: ค่าเซนเซอร์สด + กราฟ"><span class="ico"><svg class=i><use href=#i-logo></use></svg></span>ค่าสดบนนาฬิกา ↗</button>
    </nav>
    <div class="spacer"></div>
    <div class="side-card" id="side-device">
      <div class="row between"><b>นาฬิกา</b><span class="dot" id="side-dot"></span></div>
      <div class="muted" id="side-device-text">กำลังค้นหา...</div>
    </div>
    <div class="side-card muted">Studio <span id="studio-ver"></span> · <a href="/docs" target="_blank">API docs</a></div>
  </aside>

  <main>
    <!-- ======================= แถบบน ======================= -->
    <header class="topbar">
      <h2 id="view-title">ทดสอบ</h2>
      <span class="pill" id="pill-conn"><span class="dot" id="conn-dot"></span><span id="conn-text">ไม่ได้เชื่อมต่อ</span></span>
      <span class="pill" id="pill-engine" title="สถานะ LieEngine บนนาฬิกา"><svg class=i><use href=#i-chip></use></svg> <span id="engine-text">-</span></span>
      <span class="pill" id="pill-batt" title="แบตเตอรี่"><svg class=i><use href=#i-batt></use></svg> <span id="batt-text">-</span></span>
      <span class="pill" id="pill-net" title="WiFi: ความหน่วง / ข้อมูลหาย"><svg class=i><use href=#i-wifi></use></svg> <span id="net-text">-</span></span>
      <button class="btn sm ghost" id="btn-theme" title="สลับโหมดสว่าง/มืด"><svg class=i><use href=#i-contrast></use></svg></button>
    </header>

    <section class="view active" id="view-session"></section>
    <section class="view" id="view-results"></section>
    <section class="view" id="view-system"></section>
    <section class="view guide" id="view-guide"></section>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
