; =====================================================================
;  Wireless Polygraph Watch — เฟิร์มแวร์ฉบับสมบูรณ์ (ESP32-C3 SuperMini)
; =====================================================================
;  กด Build (✓) / Upload (→) ที่แถบล่างของ VS Code ได้เลย
;  ครั้งแรกต้องต่อเน็ต: PlatformIO จะดาวน์โหลด toolchain RISC-V ของ ESP32-C3 เอง
;
;  ไม่ใช้ไลบรารีภายนอกเลย (driver เซนเซอร์ทุกตัวเขียนเองในโฟลเดอร์ src/drivers)
;  ใช้แค่ไลบรารีที่มากับ Arduino-ESP32: Wire, WiFi, WebServer, Update,
;  ArduinoOTA, ESPmDNS, Preferences, EEPROM, LittleFS
;
;  โค้ดเขียนให้คอมไพล์ได้กับ Arduino-ESP32 2.0.17 (ที่ platform espressif32 ของ
;  PlatformIO ใช้) และมี #if รองรับ 3.x ไว้ด้วย
; =====================================================================

[platformio]
; กด Build เฉย ๆ จะคอมไพล์แค่ env นี้ (env native ไว้รันเทสบนคอมเท่านั้น)
default_envs = esp32c3

; ---------------------------------------------------------------------
;  env หลัก: อัปโหลดผ่านสาย USB-C
; ---------------------------------------------------------------------
[env:esp32c3]
platform  = espressif32
board     = esp32-c3-devkitm-1        ; บอร์ดอ้างอิงที่ใช้ชิป ESP32-C3 เหมือน SuperMini
framework = arduino

; แผนที่หน่วยความจำแฟลช 4 MB ที่ออกแบบเอง (ดูคำอธิบายในไฟล์)
board_build.partitions = partitions_polygraph.csv
; พาร์ทิชันชื่อ "spiffs" จะถูกใช้เป็น LittleFS
board_build.filesystem = littlefs
; DIO ใช้ได้กับชิปแฟลชทุกรุ่น — SuperMini บางล็อตบูตไม่ขึ้นถ้าใช้ QIO
board_build.flash_mode = dio

build_flags =
    ; เทียบเท่า "USB CDC On Boot: Enabled" ใน Arduino IDE
    ; ถ้าไม่ใส่ Serial จะไม่ออกทางพอร์ต USB-C ของ SuperMini
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 0 = ปิด log ภายในของ core (ไม่ให้ปนกับข้อความของเรา)
    -DCORE_DEBUG_LEVEL=0

monitor_speed   = 115200
; esp32_exception_decoder = แปลง backtrace ตอนระบบล่ม (panic/WDT) เป็นชื่อฟังก์ชัน+บรรทัด
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; เทสบนคอมอยู่ใน env native — ไม่ต้องเอาไปรันบนบอร์ด
test_ignore = test_native

; ---------------------------------------------------------------------
;  env OTA: อัปโหลดเฟิร์มแวร์ "ไร้สาย" ผ่าน WiFi (ArduinoOTA / espota)
;  วิธีใช้: ต่อ WiFi "Polygraph-Watch" ก่อน แล้วเลือก env:esp32c3_ota -> Upload
;  (Windows Firewall จะถามให้อนุญาต python — ต้องกด Allow)
; ---------------------------------------------------------------------
[env:esp32c3_ota]
extends         = env:esp32c3
upload_protocol = espota
upload_port     = 192.168.4.1
; รหัสต้องตรงกับ OTA_PASSWORD ใน src/config.h
upload_flags    =
    --auth=polygraph-ota
    --port=3232

; ---------------------------------------------------------------------
;  env native: unit test ของโมดูลที่ไม่พึ่งฮาร์ดแวร์ (DSP + LieEngine)
;  รันด้วย:  pio test -e native   (ต้องมี gcc/g++ ในเครื่อง เช่น MSYS2/MinGW)
;  ไม่จำเป็นต่อการใช้งาน — มีไว้พิสูจน์ว่าอัลกอริทึมถูกต้อง
; ---------------------------------------------------------------------
[env:native]
platform        = native
test_build_src  = yes
build_src_filter = -<*> +<dsp/> +<lie/> +<drivers/sensor_math.cpp>
build_flags     = -std=gnu++11 -DPOLY_NATIVE
test_filter     = test_native
